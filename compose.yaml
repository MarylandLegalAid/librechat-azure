# =============================================================================
# The whole stack, on one VM.
# =============================================================================
# Nothing here is started by hand. scripts/deploy.sh is the only thing that runs
# `docker compose up`, and it always passes a storage overlay:
#
#   docker compose -f compose.yaml -f compose.storage.disk.yml up -d
#
# Two rules this file follows everywhere, both load-bearing:
#
#  1. EVERY published port binds 127.0.0.1 except Caddy's 80 and 443. Caddy
#     reaches the other services over the Compose network. Nothing else can
#     reach them even if someone later loosens a network security group rule —
#     the NSG stops being the only control between the internet and your data.
#
#  2. There is NO mongo-express, or any other database GUI. User administration
#     is the Admin Panel's job. Anything else is:
#         docker compose exec mongodb mongosh LibreChat
#
# Persistent state lives under ${DATA_DIR} — the mounted Azure data disk — so
# the OS disk can be rebuilt, or the VM resized, without touching data. Azure
# Backup protects that disk; see docs/modules/backups.md.
# =============================================================================

name: librechat

services:

  # ---------------------------------------------------------------------------
  # Caddy — the only internet-facing service.
  # ---------------------------------------------------------------------------
  # Terminates TLS and routes hostnames to the two web services. Certificates are
  # obtained and renewed automatically from Let's Encrypt; port 80 must stay open
  # for the ACME HTTP challenge and the redirect to HTTPS.
  #
  # ${DATA_DIR}/caddy holds the certificates and account keys. Losing it means
  # re-issuing certificates, which Let's Encrypt rate-limits — hence the data
  # disk rather than an ephemeral volume.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by ./Caddyfile. Set these in the environment (env.defaults or
      # Key Vault) — they change at cutover when the staging hostnames are
      # replaced by the production ones.
      CHAT_DOMAIN: ${CHAT_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    depends_on:
      - api
      - admin-panel

  # ---------------------------------------------------------------------------
  # LibreChat itself.
  # ---------------------------------------------------------------------------
  # PINNED to a release tag on purpose. The previous deployment tracked
  # `librechat-dev:latest`, which is how it silently drifted onto a pre-release
  # and stayed there. renovate.json watches this line and opens a pull request
  # on each new release, so upgrades become a reviewed decision instead of a
  # surprise on restart.
  api:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    container_name: LibreChat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      # Where the admin panel lives, so the app can send administrators back
      # after they authenticate. The panel delegates OAuth to the app; if this is
      # wrong or unset, admin SSO fails with an unhelpful error.
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      # Explicit, rather than relying on LibreChat's cwd-sniffing fallback in
      # packages/data-schemas/src/config/utils.ts, which resolves to different
      # directories depending on how the process was started.
      LIBRECHAT_LOG_DIR: /app/logs
      # Keep internal service-to-service calls away from any outbound proxy.
      # Copied from upstream's compose; removing the service names here breaks
      # RAG and search behind a corporate proxy in a way that is hard to trace.
      PROXY: ${PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},mongodb,meilisearch,rag_api,vectordb,legalserver-mcp,letterwriter-mcp
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},mongodb,meilisearch,rag_api,vectordb,legalserver-mcp,letterwriter-mcp
    volumes:
      # librechat.runtime.yaml is generated by deploy.sh — librechat.yaml merged
      # with one config/storage/ overlay. It is gitignored. Do not mount
      # librechat.yaml directly; it has no fileStrategy and the app would fall
      # back to defaults. See config/storage/README.md.
      - ./librechat.runtime.yaml:/app/librechat.yaml:ro
      - ${DATA_DIR}/logs:/app/logs
      - ${DATA_DIR}/skill:/app/skill
      # Branding. Mounted as FOUR INDIVIDUAL FILES, not as a directory —
      # /app/client/dist/assets also holds LibreChat's compiled JavaScript and
      # CSS bundles, and mounting a directory over it would hide them and serve
      # a blank page. Replace the files in client/public/assets/ to rebrand;
      # nothing needs rebuilding. See docs/modules/branding.md.
      - ./client/public/assets/logo.svg:/app/client/dist/assets/logo.svg:ro
      - ./client/public/assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./client/public/assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./client/public/assets/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      # uploads and images are mounted by the storage overlay, not here — under
      # FILE_STORAGE=s3 they must NOT be bind-mounted.
    depends_on:
      mongodb:
        condition: service_healthy
      rag_api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # ---------------------------------------------------------------------------
  # Admin Panel — shipped as its own image since v0.8.7, not baked into the app.
  # ---------------------------------------------------------------------------
  # A thin client: every action it takes goes through LibreChat's /api/admin/*
  # endpoints, and authorization is LibreChat's, not the panel's. A user needs a
  # LibreChat account with role ADMIN. It runs on its own hostname (see the
  # Caddyfile) so it can be restricted or taken down independently of the chat
  # app.
  #
  # ADMIN_PANEL_SESSION_SECRET is REQUIRED — the panel refuses to start without
  # it. It is new in v0.8.7 and is the variable most likely to be missed when
  # upgrading from an older version.
  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: admin-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      # Plain expansion (not :?) so `docker compose down` and `pull` still work
      # when this is unset — matching upstream's own compose.
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: ${DOMAIN_CLIENT}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-true}
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Data stores.
  # ---------------------------------------------------------------------------
  # None of these publish a port. They are reachable only from other containers
  # on this network.
  #
  # These three images start as root and drop privileges in their own
  # entrypoints, chowning their data directory on the way. That is why the bind
  # mounts below need no ownership setup — and why you must NOT add a `user:`
  # directive to them, which would skip that chown and leave the database unable
  # to write to its own data directory.
  mongodb:
    image: mongo:8.0.20
    container_name: chat-mongodb
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - ${DATA_DIR}/mongo:/data/db
      # Read-only, so that maintenance scripts can be run with the mongosh that
      # already ships in this image — no Node runtime and no npm install on the
      # host, and nothing to download at the moment a migration runs. See
      # scripts/migrate-agent-models.sh.
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: chat-meilisearch
    restart: unless-stopped
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      # The version is part of the path on purpose — upstream does the same.
      # Meilisearch cannot read a data directory written by a different minor
      # version; encoding the version means an upgrade starts with an empty
      # index and rebuilds from Mongo, rather than crash-looping on a format it
      # does not understand. The index is derived data; losing it costs a
      # reindex, not a restore.
      - ${DATA_DIR}/meili_data_v1.35.1:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: vectordb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librechat}
      POSTGRES_USER: ${POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${DATA_DIR}/pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-librechat} -d ${POSTGRES_DB:-librechat}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # File chat / RAG. Embeds uploaded documents into vectordb.
  #
  # EMBEDDINGS_MODEL comes from .env and is FROZEN — changing it invalidates
  # every vector already stored here, and file chat returns confident nonsense
  # until every document is re-uploaded. See docs/modules/models.md.
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: rag_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-librechat}
      POSTGRES_USER: ${POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RAG_PORT: ${RAG_PORT:-8000}
    depends_on:
      vectordb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # MCP tool servers — optional, one Compose profile each.
  # ---------------------------------------------------------------------------
  # Off unless named in COMPOSE_PROFILES. Each lives in its own public
  # repository and publishes its own image, so it stays useful to organizations
  # that do not run LibreChat at all.
  #
  # Neither is published to the host or to the internet. The Compose network is
  # the trust boundary; both images support an optional shared-secret header
  # that is deliberately left unset. See docs/modules/mcp-servers.md.
  legalserver-mcp:
    image: ghcr.io/marylandlegalaid/legalserver-mcp:v3.0.0
    container_name: legalserver-mcp
    profiles: ["mcp-legalserver"]
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3001"
      # The MCP SDK's Express host check rejects requests whose Host header is
      # not listed. The Compose service name is what LibreChat will send.
      MCP_ALLOWED_HOSTS: legalserver-mcp,localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  letterwriter-mcp:
    image: ghcr.io/marylandlegalaid/letterwriter-mcp:v1.0.0
    container_name: letterwriter-mcp
    profiles: ["mcp-letterwriter"]
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3002"
      MCP_ALLOWED_HOSTS: letterwriter-mcp,localhost,127.0.0.1
      # Letterhead .docx files are an organization's private branding and are
      # never committed to git. They are placed on the data disk out of band and
      # are covered by Azure Backup. See docs/modules/mcp-letterwriter.md.
      LETTERHEAD_DIR: /data/letterheads
    volumes:
      - ${DATA_DIR}/letterheads:/data/letterheads:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
