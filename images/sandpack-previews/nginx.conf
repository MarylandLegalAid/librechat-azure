# Two static sites; Caddy decides which one a hostname reaches.
#   8080  static template server (<id>-preview.<preview domain>)
#   8081  React bundler          (bundler.<preview domain>)
# No access log here: Caddy logs every request at the edge.

server {
    listen 8080;
    server_name _;
    root /srv/static;
    access_log off;
    server_tokens off;

    # The service worker answers for every path in a preview; anything the
    # worker has not claimed yet falls back to the bootstrap page.
    location / {
        try_files $uri /index.html;
    }

    # The worker script must never be cached stale, or a new build would
    # keep serving the old worker.
    location ~ ^/__csb_sw\. {
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 8081;
    server_name _;
    root /srv/bundler;
    access_log off;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
