# =============================================================================
# LibreChat application configuration.
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
# =============================================================================
#
# THIS FILE IS NOT WHAT THE CONTAINER READS.
#
# scripts/deploy.sh merges this file with two kinds of overlay and writes the
# result to librechat.runtime.yaml, which is what gets bind-mounted into the api
# container:
#
#   config/storage/<FILE_STORAGE>.yaml   exactly one, always
#   config/mcp/<profile>.yaml            one per profile in COMPOSE_PROFILES
#
# Both exist because the key they set cannot be driven from the environment at
# runtime: fileStrategy is parsed as a zod enum with no ${VAR} interpolation
# (config/storage/README.md), and an mcpServers entry present while its
# container is not running costs ~60s of failed connections at every startup
# (config/mcp/README.md).
#
# To see exactly what your deployment will run, with the same command deploy.sh
# uses — note `*+`, which appends arrays rather than replacing them:
#
#   yq eval-all '. as $item ireduce ({}; . *+ $item)' \
#     librechat.yaml config/storage/disk.yaml config/mcp/mcp-legalserver.yaml
#
# =============================================================================

# Configuration version (required) — matches the librechat.example.yaml shipped
# with v0.8.7. Verified against the v0.8.7 release tag, not inferred from the
# changelog. When you upgrade LibreChat, diff the new release's own
# librechat.example.yaml against this file; renamed and removed keys are the most
# common upgrade break and prose changelogs miss them.
version: 1.3.17

# Caches the parsed config for faster loading across the app lifecycle.
cache: true

# Requires a valid session to fetch anything under /images/.
#
# LEAVING THIS UNSET IS NOT A NEUTRAL DEFAULT — IT SERVES THE DATA DISK TO THE
# INTERNET. api/server/index.js mounts the images directory as a static route:
#
#   app.use('/images/', createValidateImageRequest(appConfig.secureImageLinks), routes.staticRoute);
#
# and createValidateImageRequest returns a passthrough — `(_req,_res,next) => next()`
# — when the value is falsy. The guard is present in the chain, named as though it
# guards, and does nothing. compose.storage.disk.yml bind-mounts ${DATA_DIR}/images
# onto exactly the directory that route serves, so with this key absent every
# generated image AND every image a user has ever uploaded is readable by anyone
# who has the URL, with no LibreChat session. Verified on staging 2026-07-31: a
# user's uploaded photo returned 200 to an unauthenticated request.
#
# Enabled, the middleware requires a `refreshToken` cookie that verifies against
# JWT_REFRESH_SECRET and is unexpired, AND that the path is /images/<that user's
# own id>/<file>. Entra users reach the same branch: the OpenID path in
# AuthService.js sets the same cookie, and the alternative branch needs
# OPENID_REUSE_TOKENS, which this deployment does not set.
#
# Two consequences that are deliberate, not oversights:
#   1. Images in publicly shared conversations stop loading for anyone not signed
#      in. John's call, 2026-07-31: safety over convenience.
#   2. Agent avatars remain readable by any SIGNED-IN user, not by the public.
#      The middleware exempts /images/<24-hex>/agent-* by regex, but that
#      exemption sits *after* the cookie and token checks, so it waives only the
#      "is this your own user id" test, never authentication. That is what makes
#      a shared agent's avatar — which lives under its author's user id — render
#      for everyone else. Verified on staging 2026-07-31: another author's agent
#      avatar returns 200 with a session and 401 without one.
#
# The uploads half — PDFs, .docx, spreadsheets — was never affected: those are
# served by /api/files, which sits behind requireJwtAuth.
secureImageLinks: true

# =============================================================================
# Interface
# =============================================================================
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/interface
interface:
  # modelSpecs (below) requires these two to be explicit — defining any
  # modelSpecs.list silently disables modelSelect/parameters/presets for any
  # of the three that isn't already set here, so pin them to their pre-existing
  # (LibreChat default) values to avoid losing the model dropdown and parameter
  # controls when the default-model spec was added.
  modelSelect: true
  parameters: true
  # Disables the preset button
  presets: false
  # Real-time context-window/token-usage gauge in the conversation UI. This
  # already defaults to true (unlike modelSelect/parameters/presets above,
  # it is NOT affected by modelSpecs.list) — pinned explicitly anyway so the
  # choice is visible in git rather than resting on an implicit default that
  # could change in a future LibreChat release.
  contextUsage: true
  # The dollar figure in the gauge is ON, knowing it is approximate (John,
  # 2026-10-15: it still gives people a relative sense of cost). Known errors,
  # measured on staging that day: v0.8.8 prices every Claude cache write at the
  # 5-minute rate (1.25x input), but its agents SDK sends the 1-hour cache,
  # billed at 2x ($8/M on Opus 5.5, not $5), so Claude threads read 15-30% low
  # (a Complex thread showed $0.048 for $0.061). gpt-6.1-sol is priced as
  # gpt-6-sol, so its cache reads count double ($0.20/M, not $0.10/M); GPT-6
  # Luna is exact. Built-in endpoints take no price overrides (tokenConfig is
  # custom-endpoint only). Revisit after an upstream release prices the TTL.
  contextCost: true
  # "Run Code" button on Markdown code blocks — executes via the self-hosted
  # code interpreter on its own VM (it needs /dev/kvm, which is why it cannot
  # live in this Compose stack). See docs/modules/code-interpreter.md.
  # Requires LIBRECHAT_CODE_BASEURL and the CODEAPI_* variables to be set;
  # leave this false if you are not running an interpreter.
  runCode: true
  # Deliberately keep execute_code unpinned while retaining the Run Code action.
  defaultPinnedTools: []
  # Agent Marketplace (v0.8.0+, resurfaced in the model selector in v0.8.7 —
  # PR #13553): lets users publish agents org-wide via SHARE_PUBLIC in the
  # Agent Builder UI, instead of every agent being personal-only. Decided
  # 2026-07-20: turn on with no publish restriction — there's no custom-role
  # system in place to gate who can SHARE_PUBLIC, so this is all-or-nothing for
  # now. Revisit narrowing it if that changes.
  agents: true
  marketplace:
    use: true
  # Privacy Policy and Terms of Service links in the footer.
  #
  # GRANTEES: replace both URLs and the whole modalContent below with your own
  # organization's policies before you let anyone log in. See
  # docs/modules/branding.md. Shipping someone else's terms of service is worse
  # than shipping none.
  privacyPolicy:
    externalUrl: "https://mdlegalaid.sharepoint.com/:w:/s/briefcase-ops-it/IQA90qYWF5yyTaqUvbBC2hlgAfwtSkETx0_18RSnNoXAt0E?e=x9sgPE"
    openNewTab: true
  termsOfService:
    externalUrl: "https://mdlegalaid.sharepoint.com/:b:/s/briefcase-ops-it/ESp1b64hLm9DuNO699zqDd4BTuizAgZE8QzlEjo4jv_EMA"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "MLAGPT 4.2 User Agreement"
    modalContent: |
     By accessing or using MLAGPT, you acknowledge that you have read, understood, and agree to the terms below. You must click “I accept” to continue.

     ## 1. Purpose of MLAGPT
     MLAGPT is an internal Maryland Legal Aid AI platform designed to support legal, operational, and administrative work. It may assist with drafting, summarization, research support, and workflow efficiency. MLAGPT does not replace professional judgment, legal analysis, or official work product review.

     ## 2. Confidentiality & Sensitive Information

      You are responsible for ensuring that any information entered into MLAGPT complies with organizational policies, confidentiality obligations, and applicable laws.
      - Always verify which features are approved for confidential or regulated data before use.
      - Files you attach to a chat (PDFs, images, Word documents, spreadsheets) are sent with your message to the AI provider that runs the chosen model (OpenAI or Anthropic). PDFs and images are read by the model directly, page by page.
     ## 3. Web Search Is Not HIPAA-Compliant and May Violate Client Confidentiality

     ### Important Notice
     The Web Search feature is NOT HIPAA-compliant. Client confidentiality should be considered before use.
     - Web Search may send queries to external third-party services outside of MLAGPT’s secure environment.
     - You must not include PHI, client names, case details, medical information, or other sensitive or confidential data when using Web Search.
     - Use Web Search only for general, non-sensitive, public information.
     By continuing, you acknowledge that you understand this limitation and agree to use Web Search appropriately.

     ## 4. Accuracy & Verification

     AI-generated responses:
     - May be incomplete, outdated, or inaccurate
     - May contain errors or require contextual judgment

     You agree to independently review, verify, and validate all outputs before relying on them for any legal, operational, or decision-making purpose.

     ## 5. Choosing a Preset

     Standard is the default and suits most legal and administrative work. Quick is faster and less expensive, for everyday questions, short drafting and quick summaries. Complex is the most capable, for in-depth analysis, long documents and careful reasoning; it is slower and costs more. For very long documents, use Complex.

     ## 6. Code Interpreter

     Code Interpreter executes uploaded files and AI-generated code in isolated temporary sandboxes hosted in Maryland Legal Aid’s Azure environment. Sandbox code has no public internet access. Each file sent to or returned from Code Interpreter must be under 50 MB; a larger upload fails with a general “Error processing file” message. Temporary workspaces are removed after one hour, reusable interpreter session files after 24 hours, and files returned to a chat follow normal MLAGPT retention. Confidential client data is permitted. Users remain responsible for reviewing generated code, analysis, and files.

     ## 7. Prohibited Use

     You agree not to use MLAGPT to:
     - Provide legal advice directly to clients without proper review
     - Generate or submit work product without human oversight
     - Bypass organizational policies, security controls, or safeguards
     - Enter sensitive data into unapproved features (including Web Search)

     ## 8. Monitoring & Compliance

     Use of MLAGPT may be logged or monitored for security, compliance, and system improvement purposes, consistent with organizational policy.

     ## 9. Acceptance

     By clicking “I accept”, you confirm that:
     - You understand the limitations of MLAGPT
     - You understand that Web Search is not HIPAA-compliant
     - You agree to use the platform responsibly and in accordance with organizational policy

     **If you do not agree, do not proceed.**
  # Greeting shown on a new chat.
  customWelcome: "Howdy! Welcome to MLAGPT 4.2 - How can I help you today?"

# =============================================================================
# Registration
# =============================================================================
# Which social-login buttons may appear. Only `openid` is listed because that is
# the only provider this blueprint documents wiring up (Entra ID, Google
# Workspace and Okta all speak OIDC — see docs/modules/sso-oidc.md). Listing a
# provider here does not enable it; the corresponding environment variables do.
registration:
  socialLogins: ['openid']

  # ⚠️  GRANTEES: uncomment this and put YOUR email domains here before you let
  # anyone reach the login page.
  #
  # The default configuration allows self-registration so that you can create
  # the first administrator account without any identity provider. That is
  # convenient for ten minutes and dangerous afterwards: until you restrict it,
  # anyone who finds your URL can create an account. This list is the fix —
  # only addresses at these domains may register.
  #
  # allowedDomains:
  #   - "example.org"
  #
  # Maryland Legal Aid does not set this because it sets ALLOW_REGISTRATION=false
  # and creates accounts through Entra ID single sign-on instead. Either approach
  # closes the hole; doing neither does not.

# =============================================================================
# Endpoints
# =============================================================================
endpoints:
  agents:
    # Pinned explicitly so a future LibreChat default change cannot silently
    # remove Execute Code. This is v0.8.8's default list: `memory` gives agents
    # a tool to read and write the user's memories on purpose (the background
    # memory extraction under `memory:` works without it), and
    # `ask_user_question` lets an agent stop and ask the user a question.
    capabilities:
      - "deferred_tools"
      - "execute_code"
      - "file_search"
      - "web_search"
      - "artifacts"
      - "subagents"
      - "actions"
      - "context"
      - "skills"
      - "memory"
      - "ask_user_question"
      - "tools"
      - "chain"
      - "ocr"
    # v0.8.8 lets users enroll their own machines as code workers, up to five
    # each by default, through the interpreter's bring-your-own-machine bridge.
    # This deployment's interpreter keeps that bridge off (codeinterpreter/
    # compose.yaml, and Caddy refuses its URL), so enrollment could only fail.
    # Off here too, so the option is not offered at all.
    #
    # The schema requires allowedEnvironments whenever this block exists. The
    # list below is all three, which is the default when the block is omitted.
    statefulCodeSessions:
      allowedEnvironments: ["user", "agent-user", "conversation"]
      principalWorkers:
        enabled: false

    # The providers the Agent Builder offers, and the only ones an agent may
    # use. An explicit allowlist rather than the default (every endpoint): it
    # is what keeps the retired custom endpoint below out of the Builder.
    allowedProviders:
      - openAI
      - anthropic

  # ---------------------------------------------------------------------------
  # The built-in openAI endpoint: GPT-6. The models are OPENAI_MODELS in
  # env.defaults.
  # ---------------------------------------------------------------------------
  # Tool use on these models needs the Responses API. v0.8.8 routes every GPT-6
  # model there on its own whenever useResponsesApi is unset
  # (packages/api/src/endpoints/openai/llm.ts, `prefersResponsesApiByModel`).
  # Re-check that rule at every LibreChat upgrade. What it does not cover: a
  # conversation, preset or agent that stores useResponsesApi: false keeps Chat
  # Completions, and tools then fail for that user. The built-in endpoint takes
  # no addParams, so nothing here can force it. The model migrations clear
  # stored `false` values, and validate-config.sh keeps OPENAI_MODELS to GPT-6.
  # Full story: docs/modules/models-gpt56-responses.md
  openAI:
    # titleConvo MUST stay true. Agent conversations get no title at all when
    # it is false (api/server/services/Endpoints/agents/title.js returns early,
    # with no fallback), while direct chats keep titling, so a smoke test of
    # direct chats does not catch it. validate-config.sh asserts it.
    titleConvo: true
    titleModel: "gpt-6-luna"

  # ---------------------------------------------------------------------------
  # RETIRED: the custom "OpenAI GPT-5.6 Responses" endpoint.
  # ---------------------------------------------------------------------------
  # It existed because v0.8.7 sent GPT-5.6 to Chat Completions, where reasoning
  # plus tools fails; its addParams forced the Responses API. v0.8.8 does that
  # for GPT-6 itself (above), so the endpoint is being retired in two steps
  # (UPGRADE_PLAN Phase 3 step 2):
  #
  #   A. now: kept, but hidden. It is not in modelSpecs.addedEndpoints, not in
  #      agents.allowedProviders, and no spec points at it, so nobody can choose
  #      it. Its models stay the GPT-5.6 ones, so a conversation or agent the
  #      migrations have not moved yet still resolves instead of failing.
  #   B. after a clean watch period: delete this block, once a query shows
  #      nothing references the name. Old messages keep the name and show a
  #      generic icon; John accepted that on 2026-10-15.
  #
  # The admin panel's DB override (configs, role __base__) carries a copy of this
  # definition too. Step B removes it there as well.
  custom:
    - name: "OpenAI GPT-5.6 Responses"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://api.openai.com/v1"
      models:
        default:
          - "gpt-5.6-luna"
          - "gpt-5.6-terra"
          - "gpt-5.6-sol"
        fetch: false
      # titleConvo MUST stay true. It was false until 2026-07-30, copied from the
      # Render config where it was harmless because no agent pointed at this
      # endpoint. Once §11.3 moved agents here it stopped being harmless:
      # api/server/services/Endpoints/agents/title.js early-returns on
      # `client.options.titleConvo === false`, with no fallback to titleModel and
      # no delegation elsewhere, so every conversation on every migrated agent was
      # silently saved as "New Chat". Upstream's own test asserts this behaviour
      # ("skips generation when the endpoint disables titleConvo").
      #
      # Note the asymmetry that made it hard to spot: DIRECT chats on this
      # endpoint titled correctly throughout — the non-agent path does not consult
      # this flag. Only agents were affected, which is why the smoke test's model
      # checks all passed while 15 of 24 agents quietly lost their titles.
      titleConvo: true
      titleModel: "gpt-5.6-luna"
      summarize: false
      modelDisplayLabel: "OpenAI"
      addParams:
        useResponsesApi: true

# =============================================================================
# Model specs
# =============================================================================
# Three presets at the top of the model selector. They carry no `group`: v0.8.8
# lists ungrouped specs first, then the endpoints, then grouped specs, so a
# group would put them at the bottom (John, 2026-10-16: top). A spec's `order`
# does not sort the menu; list order does.
#
# Standard is the hard `default`: every new chat starts on it, whatever the
# user picked last (John, 2026-10-16; revert to `softDefault: true` if people
# dislike it, which remembers each user's last choice instead).
#
# Quick runs at low reasoning effort and has no Run Code, for speed (John,
# 2026-10-16). Without modelSpecs.enforce a conversation keeps the settings it
# stored, so changing a preset reaches only new chats unless existing
# conversations are updated to match (John: leave old Quick threads at medium).
#
# A preset's tool flags (executeCode, fileSearch, webSearch, memory, skills,
# askUserQuestion) FORCE the tool on: the server adds it for every turn on that
# preset whatever the chat's toggle says, so a user cannot switch it off
# (staging 2026-10-16: Run Code unticked on Standard, the browser sent
# execute_code:false, the model still ran code). The toggle can only ADD a tool
# a preset lacks. `artifacts` is the exception: it only preselects, in the
# browser, and the user can switch it off.
#
# Artifacts is preselected on all three presets (John, 2026-10-16): longer
# reusable drafts (letters, reports) open in a side panel. It adds roughly 3K
# tokens of instructions to each turn; users switch it off in Tools Options.
#
# No preset preselects File Search (John, 2026-10-16). Under unified uploads a
# new attachment is never indexed: it reaches the model whole (PDFs and images
# natively, other documents as text), with or without File Search (staging
# test that day: 23,495 tokens with the tool, 23,358 without; the difference
# is the tool's definition; no search call, nothing indexed).
# File Search only reaches documents indexed before v0.8.8, in old threads or
# re-attached from the side panel; users switch it on under Tools for those.
#
# addedEndpoints keeps the raw built-in endpoints selectable alongside the
# presets. It must never list the retired custom endpoint, and no preset may
# point at it (validate-config.sh checks both).
#
# maxContextTokens caps each prompt; summarization (below) makes the cap
# summarize older history instead of dropping it. GPT-6 prices a whole request
# at double the input rate (1.5x output) once its prompt passes 272K tokens.
# Quick: 250000, below that step. Standard: 400000 (John, 2026-10-19), past it
# on purpose so long documents fit on the default preset, at the higher rate
# for prompts between 272K and 400K. Complex has no cap: Opus 5.5 is priced
# flat across its window.
#
# The admin panel's DB override holds a copy of modelSpecs.list (descriptions
# edited there, 2026-10-19), and that copy wins over this file. Change a preset
# in both places, or remove the override's copy.
modelSpecs:
  addedEndpoints:
    - openAI
    - anthropic
    - agents
  list:
    - name: "quick"
      label: "Quick"
      description: "Fast and inexpensive — email drafts, meeting notes, everyday questions."
      artifacts: true
      preset:
        endpoint: "openAI"
        model: "gpt-6-luna"
        reasoning_effort: "low"
        useResponsesApi: true
        maxContextTokens: 250000
    - name: "standard"
      label: "Standard"
      description: "Balanced — best option for most legal and administrative work. Great for brainstorming, research, and analysis."
      artifacts: true
      default: true
      executeCode: true
      preset:
        endpoint: "openAI"
        model: "gpt-6.1-sol"
        reasoning_effort: "medium"
        useResponsesApi: true
        maxContextTokens: 400000
    - name: "complex"
      label: "Complex"
      description: "Capable but costly — use sparingly for in-depth analysis, careful reasoning, or a second opinion."
      artifacts: true
      executeCode: true
      preset:
        endpoint: "anthropic"
        model: "claude-opus-5-5"
        # Opus 5.5 defaults to medium.
        effort: "high"

# =============================================================================
# Speech to text
# =============================================================================
# FROZEN. The STT model is a specialist model, changed only as a deliberate,
# separately-tested decision — not as part of a chat-model refresh.
speech:
  speechTab:
    speechToText:
      # 'openai' still validates in v0.8.8 and is normalized to 'external' (an
      # outside STT service, configured under speech.stt below).
      engineSTT: "openai"
      autoTranscribeAudio: true
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: 'whisper-1'
# Attachments: no `fileConfig` block at all, on purpose. Without
# `legacyFileUploadUX`, v0.8.8's unified upload applies. Images and PDFs go to
# the model natively; other documents (.docx, spreadsheets, text) are extracted
# to text and put in the prompt. (An empty `fileConfig:` key is YAML null and
# v0.8.8 refuses to start on it.) Upload limits live in the admin panel's DB
# override, not here.
#
# Know this: a native PDF or image is NOT counted against a preset's
# maxContextTokens. Staging, 2026-10-15: a 40-page PDF (25.8K tokens at OpenAI,
# 93K at Anthropic) went through a 20K cap and was resent on the next turn,
# with no summary. So the caps bound text, not native attachments.
#
# There is deliberately no `fileConfig.stt` either. One existed and did
# nothing: LibreChat's config schema has no fileConfig.stt and strips it
# silently (in v0.8.7 and v0.8.8 alike), and the built-in audio list is a
# superset of it.

# =============================================================================
# MCP tool servers — deliberately NOT configured here
# =============================================================================
# There is no `mcpServers` block in this file, and that is on purpose.
#
# Each MCP server is its own public repository publishing its own container
# image; this stack consumes pinned tags, one Compose service per server, each
# behind a Compose profile that is off by default. Declaring the servers here
# would declare them unconditionally — so an instance running none of them (a
# grantee's, out of the box) would spend about 60 seconds at startup trying to
# reach containers that do not exist, logging connection errors throughout.
#
# So each server's `mcpServers` entry and its `mcpSettings.allowedAddresses`
# line live together in config/mcp/<profile>.yaml, and scripts/deploy.sh merges
# in only the overlays whose profiles are listed in COMPOSE_PROFILES. One
# variable turns a server on in both places at once, so the two cannot disagree.
#
# Neither of MLA's servers is exposed publicly. They are reachable only on the
# Compose network, and that is the trust boundary. Both images support an
# optional shared-secret header (MCP_SHARED_SECRET) that no-ops when unset; it
# is deliberately left unset, stated explicitly so the assumption is visible
# rather than accidental. Set it if you ever move an MCP off this host.
#
# See config/mcp/README.md and docs/modules/mcp-servers.md.

# =============================================================================
# Memory (personalization)
# =============================================================================
# Runs on GPT-6 Luna on the built-in openAI endpoint, the same model that
# titles chats: the cheapest one this deployment offers.
#
# ⚠️  A broken memory provider does not produce an obvious failure. Unlike an
# agent, memory extraction simply stops, and personalization quietly degrades
# with no error surfaced to anyone. The provider must be a built-in endpoint
# name and the model must be in that endpoint's list; validate-config.sh checks
# both. Verify a new memory entry appears after any change here.
#
# ⚠️  `enabled: true` is REQUIRED, and its absence fails just as silently. From
# v0.8.7, automatic memory extraction is opt-in: without it LibreChat logs one
# warning at startup and never extracts again. That is exactly what happened
# here: memory stopped at the August 2026 cutover and nobody noticed for ten
# weeks. Check `memoryentries` for recent `updated_at` values after any upgrade.
memory:
  tokenLimit: 3000
  agent:
    enabled: true
    provider: "openAI"
    model: "gpt-6-luna"

# =============================================================================
# Summarization (UPGRADE_PLAN M8, M16)
# =============================================================================
# When the next prompt would exceed a chat's context budget, the older part of
# the thread is summarized instead of dropped. The budget is the trigger: a
# preset's maxContextTokens (Quick 250,000, Standard 400,000; see Model specs),
# otherwise the model's window x 0.95. So there is no `trigger`
# here: an earlier one only means more summaries and more loss, at no saving.
#
# One summarizer for every chat, the cheapest model we run. Left unset, each
# chat would summarize itself, so a Complex chat would pay Opus at effort high for
# housekeeping. For Claude chats this means the older part of the thread goes to
# OpenAI to be summarized (both are covered providers; see docs/compliance.md).
#
# The effort is explicit because a summarizer on the chat's own provider
# otherwise inherits the chat's effort. retainRecent keeps the last two
# exchanges verbatim (upstream's default, written out). The prompts are
# upstream's defaults, which already ask for names and identifiers verbatim.
#
# The current turn is never summarized: one message bigger than the budget on
# Quick or Standard (a very long pasted text) fails with a token-budget error.
# Complex takes long text, but not large PDFs: attachments go inline as base64,
# and Anthropic refuses a request over 32 MB or 600 pages (413). Prod,
# 2026-10-19: three scanned PDFs, 126 MB, 756 pages, failed on Standard (over
# GPT-6.1 Sol's window) and on Complex (413).
summarization:
  enabled: true
  provider: "openAI"
  model: "gpt-6-luna"
  parameters:
    reasoning_effort: "medium"
  retainRecent:
    turns: 2

# =============================================================================
# Web search
# =============================================================================
# Declared rather than auto-detected. Without this block LibreChat picks each
# stage from whichever API key happens to be set, so nothing here said that web
# search used Jina at all, and nobody was looking when it stopped working.
#
#   search:  Serper     (SERPER-API-KEY)
#   scrape:  Firecrawl  (FIRECRAWL-API-KEY)
#   rerank:  Jina       (JINA-API-KEY)
#
# The API keys are left to the schema defaults, which read those variables.
#
# ⚠️  A failed rerank is silent to users. LibreChat logs "Error using Jina
# reranker" and falls back to the first few excerpts in page order. The old
# key ran out of credit and every rerank failed from at least August to
# October 2026. If web search answers seem to miss the relevant part of long
# documents, check the error log for that line first.
webSearch:
  searchProvider: "serper"
  scraperProvider: "firecrawl"
  rerankerType: "jina"
