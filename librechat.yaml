# =============================================================================
# LibreChat application configuration.
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
# =============================================================================
#
# THIS FILE IS NOT WHAT THE CONTAINER READS.
#
# scripts/deploy.sh merges this file with two kinds of overlay and writes the
# result to librechat.runtime.yaml, which is what gets bind-mounted into the api
# container:
#
#   config/storage/<FILE_STORAGE>.yaml   exactly one, always
#   config/mcp/<profile>.yaml            one per profile in COMPOSE_PROFILES
#
# Both exist because the key they set cannot be driven from the environment at
# runtime: fileStrategy is parsed as a zod enum with no ${VAR} interpolation
# (config/storage/README.md), and an mcpServers entry present while its
# container is not running costs ~60s of failed connections at every startup
# (config/mcp/README.md).
#
# To see exactly what your deployment will run, with the same command deploy.sh
# uses — note `*+`, which appends arrays rather than replacing them:
#
#   yq eval-all '. as $item ireduce ({}; . *+ $item)' \
#     librechat.yaml config/storage/disk.yaml config/mcp/mcp-legalserver.yaml
#
# =============================================================================

# Configuration version (required) — matches the librechat.example.yaml shipped
# with v0.8.7. Verified against the v0.8.7 release tag, not inferred from the
# changelog. When you upgrade LibreChat, diff the new release's own
# librechat.example.yaml against this file; renamed and removed keys are the most
# common upgrade break and prose changelogs miss them.
version: 1.3.13

# Caches the parsed config for faster loading across the app lifecycle.
cache: true

# Requires a valid session to fetch anything under /images/.
#
# LEAVING THIS UNSET IS NOT A NEUTRAL DEFAULT — IT SERVES THE DATA DISK TO THE
# INTERNET. api/server/index.js mounts the images directory as a static route:
#
#   app.use('/images/', createValidateImageRequest(appConfig.secureImageLinks), routes.staticRoute);
#
# and createValidateImageRequest returns a passthrough — `(_req,_res,next) => next()`
# — when the value is falsy. The guard is present in the chain, named as though it
# guards, and does nothing. compose.storage.disk.yml bind-mounts ${DATA_DIR}/images
# onto exactly the directory that route serves, so with this key absent every
# generated image AND every image a user has ever uploaded is readable by anyone
# who has the URL, with no LibreChat session. Verified on staging 2026-07-31: a
# user's uploaded photo returned 200 to an unauthenticated request.
#
# Enabled, the middleware requires a `refreshToken` cookie that verifies against
# JWT_REFRESH_SECRET and is unexpired, AND that the path is /images/<that user's
# own id>/<file>. Entra users reach the same branch: the OpenID path in
# AuthService.js sets the same cookie, and the alternative branch needs
# OPENID_REUSE_TOKENS, which this deployment does not set.
#
# Two consequences that are deliberate, not oversights:
#   1. Images in publicly shared conversations stop loading for anyone not signed
#      in. John's call, 2026-07-31: safety over convenience.
#   2. Agent avatars stay public. The middleware exempts
#      /images/<24-hex>/agent-* by regex, so agent cards still render before a
#      session exists. Nothing else is exempt.
#
# The uploads half — PDFs, .docx, spreadsheets — was never affected: those are
# served by /api/files, which sits behind requireJwtAuth.
secureImageLinks: true

# =============================================================================
# Interface
# =============================================================================
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/interface
interface:
  # modelSpecs (below) requires these two to be explicit — defining any
  # modelSpecs.list silently disables modelSelect/parameters/presets for any
  # of the three that isn't already set here, so pin them to their pre-existing
  # (LibreChat default) values to avoid losing the model dropdown and parameter
  # controls when the default-model spec was added.
  modelSelect: true
  parameters: true
  # Disables the preset button
  presets: false
  # Real-time context-window/token-usage gauge in the conversation UI. This
  # already defaults to true (unlike modelSelect/parameters/presets above,
  # it is NOT affected by modelSpecs.list) — pinned explicitly anyway so the
  # choice is visible in git rather than resting on an implicit default that
  # could change in a future LibreChat release. contextCost (cost-in-$ display)
  # deliberately left off/unset — not requested, and shows real dollar figures
  # to end users, a separate decision.
  contextUsage: true
  # "Run Code" button on Markdown code blocks — executes via the self-hosted
  # code interpreter on its own VM (it needs /dev/kvm, which is why it cannot
  # live in this Compose stack). See docs/modules/code-interpreter.md.
  # Requires LIBRECHAT_CODE_BASEURL and the CODEAPI_* variables to be set;
  # leave this false if you are not running an interpreter.
  runCode: true
  # Deliberately keep execute_code unpinned while retaining the Run Code action.
  defaultPinnedTools: []
  # Agent Marketplace (v0.8.0+, resurfaced in the model selector in v0.8.7 —
  # PR #13553): lets users publish agents org-wide via SHARE_PUBLIC in the
  # Agent Builder UI, instead of every agent being personal-only. Decided
  # 2026-07-20: turn on with no publish restriction — there's no custom-role
  # system in place to gate who can SHARE_PUBLIC, so this is all-or-nothing for
  # now. Revisit narrowing it if that changes.
  agents: true
  marketplace:
    use: true
  # Privacy Policy and Terms of Service links in the footer.
  #
  # GRANTEES: replace both URLs and the whole modalContent below with your own
  # organization's policies before you let anyone log in. See
  # docs/modules/branding.md. Shipping someone else's terms of service is worse
  # than shipping none.
  privacyPolicy:
    externalUrl: "https://mdlegalaid.sharepoint.com/:w:/s/briefcase-ops-it/IQA90qYWF5yyTaqUvbBC2hlgAfwtSkETx0_18RSnNoXAt0E?e=x9sgPE"
    openNewTab: true
  termsOfService:
    externalUrl: "https://mdlegalaid.sharepoint.com/:b:/s/briefcase-ops-it/ESp1b64hLm9DuNO699zqDd4BTuizAgZE8QzlEjo4jv_EMA"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "MLAGPT 4 User Agreement"
    modalContent: |
     By accessing or using MLAGPT, you acknowledge that you have read, understood, and agree to the terms below. You must click “I Agree” to continue.

     ## 1. Purpose of MLAGPT
     MLAGPT is an internal Maryland Legal Aid AI platform designed to support legal, operational, and administrative work. It may assist with drafting, summarization, research support, and workflow efficiency. MLAGPT does not replace professional judgment, legal analysis, or official work product review.

     ## 2. Confidentiality & Sensitive Information

      You are responsible for ensuring that any information entered into MLAGPT complies with organizational policies, confidentiality obligations, and applicable laws.
      - Always verify which features are approved for confidential or regulated data before use.
     ## 3. Web Search Is Not HIPAA-Compliant and May Violate Client Confidentiality

     ### Important Notice
     The Web Search feature is NOT HIPAA-compliant. Client confidentiality should be considered before use.
     - Web Search may send queries to external third-party services outside of MLAGPT’s secure environment.
     - You must not include PHI, client names, case details, medical information, or other sensitive or confidential data when using Web Search.
     - Use Web Search only for general, non-sensitive, public information.
     By continuing, you acknowledge that you understand this limitation and agree to use Web Search appropriately.

     ## 4. Accuracy & Verification

     AI-generated responses:
     - May be incomplete, outdated, or inaccurate
     - May contain errors or require contextual judgment

     You agree to independently review, verify, and validate all outputs before relying on them for any legal, operational, or decision-making purpose.

     ## 5. Code Interpreter

     Code Interpreter executes uploaded files and AI-generated code in isolated temporary sandboxes hosted in Maryland Legal Aid’s Azure environment. Sandbox code has no public internet access. Temporary workspaces are removed after one hour, reusable interpreter session files after 24 hours, and files returned to a chat follow normal MLAGPT retention. Confidential client data is permitted. Users remain responsible for reviewing generated code, analysis, and files.

     ## 6. Prohibited Use

     You agree not to use MLAGPT to:
     - Provide legal advice directly to clients without proper review
     - Generate or submit work product without human oversight
     - Bypass organizational policies, security controls, or safeguards
     - Enter sensitive data into unapproved features (including Web Search)

     ## 7. Monitoring & Compliance

     Use of MLAGPT may be logged or monitored for security, compliance, and system improvement purposes, consistent with organizational policy.

     ## 8. Acceptance

     By clicking “I Agree”, you confirm that:
     - You understand the limitations of MLAGPT
     - You understand that Web Search is not HIPAA-compliant
     - You agree to use the platform responsibly and in accordance with organizational policy

     **If you do not agree, do not proceed.**
  # Greeting shown on a new chat.
  customWelcome: "Howdy! Welcome to MLAGPT 4 - How can I help you today?"

# =============================================================================
# Registration
# =============================================================================
# Which social-login buttons may appear. Only `openid` is listed because that is
# the only provider this blueprint documents wiring up (Entra ID, Google
# Workspace and Okta all speak OIDC — see docs/modules/sso-oidc.md). Listing a
# provider here does not enable it; the corresponding environment variables do.
registration:
  socialLogins: ['openid']

  # ⚠️  GRANTEES: uncomment this and put YOUR email domains here before you let
  # anyone reach the login page.
  #
  # The default configuration allows self-registration so that you can create
  # the first administrator account without any identity provider. That is
  # convenient for ten minutes and dangerous afterwards: until you restrict it,
  # anyone who finds your URL can create an account. This list is the fix —
  # only addresses at these domains may register.
  #
  # allowedDomains:
  #   - "example.org"
  #
  # Maryland Legal Aid does not set this because it sets ALLOW_REGISTRATION=false
  # and creates accounts through Entra ID single sign-on instead. Either approach
  # closes the hole; doing neither does not.

# =============================================================================
# Endpoints
# =============================================================================
endpoints:
  agents:
    # Pin the complete v0.8.7 default list explicitly so a future LibreChat
    # default change cannot silently remove Execute Code.
    capabilities:
      - "deferred_tools"
      - "execute_code"
      - "file_search"
      - "web_search"
      - "artifacts"
      - "subagents"
      - "actions"
      - "context"
      - "skills"
      - "tools"
      - "chain"
      - "ocr"

  # THE BUILT-IN openAI ENDPOINT IS DELIBERATELY ABSENT. Do not add it back.
  #
  # It used to be configured — not user-selectable, but present — purely to host
  # two things: chat-title generation and the memory agent, both on gpt-5.4-nano,
  # which was the only model it served. On 2026-07-30 OpenAI cut gpt-5.6-luna to
  # roughly nano's price, nano was retired, and with nothing left for the built-in
  # endpoint to do it was removed outright.
  #
  # That is a security improvement, not merely a tidy-up. §11.4's protection used
  # to be three parts, one of which was "modelSpecs.addedEndpoints omits openAI so
  # the built-in endpoint is not selectable and cannot be used to bypass the forced
  # Responses route". An endpoint that does not exist cannot be bypassed to. The
  # hazard is gone rather than hidden.
  #
  # Consequences, so nobody re-adds it by accident:
  #   - OPENAI_MODELS no longer exists in env.defaults.
  #   - titleModel and the memory agent now live on the custom endpoint below.
  #   - Every OpenAI model in this deployment is therefore forced through the
  #     Responses API, with no exceptions and no second route.
  #
  # ---------------------------------------------------------------------------
  # GPT-5.6 and the Responses API — read before changing anything below.
  # ---------------------------------------------------------------------------
  # The GPT-5.6 family REJECTS requests that combine reasoning with function
  # tools on /v1/chat/completions. LibreChat's built-in openAI endpoint uses chat
  # completions by default, so GPT-5.6 breaks there exactly when tools are in
  # play — which is most of what an agent does.
  #
  # In v0.8.7, useResponsesApi is auto-enabled ONLY when web search is on
  # (packages/api/src/endpoints/openai/llm.ts). There is no model-name-based
  # detection, so upgrading LibreChat does not fix this for you.
  #
  # The fix is three parts that only work together. Removing any one of them
  # silently reintroduces the bug, and it fails at request time rather than at
  # startup, so nothing will tell you:
  #
  #   1. THIS custom endpoint, whose server-side addParams forces the Responses
  #      API even if a client submits useResponsesApi: false.
  #   2. GPT-5.6 models excluded from OPENAI_MODELS, so the built-in endpoint
  #      cannot serve them at all.
  #   3. modelSpecs.addedEndpoints omitting openAI, so the built-in endpoint is
  #      not selectable in the UI and cannot be used to bypass the forced route.
  #
  # Agents reach these models by pointing `provider` at this endpoint's `name`
  # BYTE FOR BYTE, spaces included — "OpenAI GPT-5.6 Responses". LibreChat
  # resolves a non-built-in provider through getCustomEndpointConfig, so
  # addParams applies to agent runs. That makes the routing server-enforced
  # policy rather than per-agent state a user could turn off.
  #
  # Full explanation: docs/modules/models-gpt56-responses.md
  # ---------------------------------------------------------------------------
  custom:
    - name: "OpenAI GPT-5.6 Responses"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://api.openai.com/v1"
      models:
        default:
          - "gpt-5.6-luna"
          - "gpt-5.6-terra"
          - "gpt-5.6-sol"
        fetch: false
      # titleConvo MUST stay true. It was false until 2026-07-30, copied from the
      # Render config where it was harmless because no agent pointed at this
      # endpoint. Once §11.3 moved agents here it stopped being harmless:
      # api/server/services/Endpoints/agents/title.js early-returns on
      # `client.options.titleConvo === false`, with no fallback to titleModel and
      # no delegation elsewhere, so every conversation on every migrated agent was
      # silently saved as "New Chat". Upstream's own test asserts this behaviour
      # ("skips generation when the endpoint disables titleConvo").
      #
      # Note the asymmetry that made it hard to spot: DIRECT chats on this
      # endpoint titled correctly throughout — the non-agent path does not consult
      # this flag. Only agents were affected, which is why the smoke test's model
      # checks all passed while 15 of 24 agents quietly lost their titles.
      titleConvo: true
      titleModel: "gpt-5.6-luna"
      summarize: false
      modelDisplayLabel: "OpenAI"
      addParams:
        useResponsesApi: true

# =============================================================================
# Model specs
# =============================================================================
# Makes gpt-5.6-terra the default model for a user's first-ever new chat, without
# forcing it on every subsequent new chat. softDefault (not default:true) is what
# gives that behavior: default:true would re-select gpt-5.6-terra on every new
# chat regardless of what the user last used; softDefault only fires until the
# user picks a different model/spec/agent, at which point LibreChat's own
# "last conversation setup" memory carries that choice forward for future new
# chats — nothing else to configure for the "remember their choice" half of this.
# addedEndpoints (+ interface.modelSelect above) keeps the normal anthropic and
# agents choices available alongside these pinned specs.
modelSpecs:
  # Do not add the built-in openAI endpoint here: it would expose GPT-5.6
  # through a selectable route that does not force the Responses API in v0.8.7.
  # The built-in endpoint remains configured for title/summary generation and
  # Agents; ordinary GPT-5.6 chats use only the forced custom endpoint above.
  addedEndpoints:
    - anthropic
    - agents
  list:
    - name: "gpt-5.6-luna"
      label: "GPT-5.6 Luna"
      preset:
        endpoint: "OpenAI GPT-5.6 Responses"
        model: "gpt-5.6-luna"
        useResponsesApi: true
    - name: "gpt-5.6-terra"
      label: "GPT-5.6 Terra"
      softDefault: true
      preset:
        endpoint: "OpenAI GPT-5.6 Responses"
        model: "gpt-5.6-terra"
        useResponsesApi: true
    - name: "gpt-5.6-sol"
      label: "GPT-5.6 Sol"
      preset:
        endpoint: "OpenAI GPT-5.6 Responses"
        model: "gpt-5.6-sol"
        useResponsesApi: true

# =============================================================================
# Speech to text
# =============================================================================
# FROZEN. The STT model is a specialist model, changed only as a deliberate,
# separately-tested decision — not as part of a chat-model refresh.
speech:
  speechTab:
    speechToText:
      engineSTT: "openai"          # enum: 'openai' | 'azureOpenAI' (matches speech.stt.openai below)
      autoTranscribeAudio: true
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: 'whisper-1'
fileConfig:
  stt:
    supportedMimeTypes:
      - "^audio/(mp3|mpeg|mpeg3|wav|wave|x-wav|ogg|vorbis|mp4|x-m4a|flac|x-flac|webm)$"

# =============================================================================
# MCP tool servers — deliberately NOT configured here
# =============================================================================
# There is no `mcpServers` block in this file, and that is on purpose.
#
# Each MCP server is its own public repository publishing its own container
# image; this stack consumes pinned tags, one Compose service per server, each
# behind a Compose profile that is off by default. Declaring the servers here
# would declare them unconditionally — so an instance running none of them (a
# grantee's, out of the box) would spend about 60 seconds at startup trying to
# reach containers that do not exist, logging connection errors throughout.
#
# So each server's `mcpServers` entry and its `mcpSettings.allowedAddresses`
# line live together in config/mcp/<profile>.yaml, and scripts/deploy.sh merges
# in only the overlays whose profiles are listed in COMPOSE_PROFILES. One
# variable turns a server on in both places at once, so the two cannot disagree.
#
# Neither of MLA's servers is exposed publicly. They are reachable only on the
# Compose network, and that is the trust boundary. Both images support an
# optional shared-secret header (MCP_SHARED_SECRET) that no-ops when unset; it
# is deliberately left unset, stated explicitly so the assumption is visible
# rather than accidental. Set it if you ever move an MCP off this host.
#
# See config/mcp/README.md and docs/modules/mcp-servers.md.

# =============================================================================
# Memory (personalization)
# =============================================================================
# Runs on the custom GPT-5.6 endpoint. It used to run on the built-in openAI
# endpoint with gpt-5.4-nano; both were retired on 2026-07-30 (see the endpoints
# section above), so the memory agent moved here with everything else.
#
# ⚠️  The provider string must match endpoints.custom[].name BYTE FOR BYTE. Unlike
# an agent, a broken memory provider does not produce an obvious failure — memory
# extraction simply stops happening, and personalization quietly degrades with no
# error surfaced to anyone. Verify it after any change to the endpoint name.
memory:
  tokenLimit: 3000
  agent:
    provider: "OpenAI GPT-5.6 Responses"
    model: "gpt-5.6-luna"
